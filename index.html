<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Boletin Informativo</title>
<style>
    body {
        margin: 0;
        background: rgb(34, 53, 70);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
    }
    .noticia {
        width: 70%;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: none; /* Oculto hasta que den clic */
    }
    #btn-reproducir {
        padding: 20px 40px;
        font-size: 20px;
        cursor: pointer;
        background-color: #2831a7;
        color: white;
        border: none;
        border-radius: 10px;
        font-family: sans-serif;
    }
</style>
</head>
<body>

    <button id="btn-reproducir">📢 Clic para ver Boletín con Sonido</button>

    <video id="miVideo" class="noticia" 
        src="https://res.cloudinary.com/daib0eknj/video/upload/v1774882852/Induccion_entrada_H2o_iaaktv.mp4" 
        loop playsinline>
    </video>

    <script>
        const btn = document.getElementById('btn-reproducir');
        const video = document.getElementById('miVideo');

        btn.addEventListener('click', () => {
            video.style.display = 'block'; // Mostramos el video
            btn.style.display = 'none';    // Ocultamos el botón
            video.muted = false;           // Aseguramos que tenga audio
            video.play();                  // ¡Arranca con sonido!
        });
    </script>

</body>
</html>
